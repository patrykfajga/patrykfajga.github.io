<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · Patryk Fajga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/site.css?v=4" | relURL }}">
</head>
<body>
  <header class="site-header"><div class="site-header-inner page-width"><a class="site-name" href="{{ "/" | relURL }}">Patryk Fajga</a><nav class="main-nav" aria-label="Główna nawigacja"><a href="{{ "/#about" | relURL }}">O mnie</a><a href="{{ "/projects/" | relURL }}">Projekty</a><a href="{{ "/conferences/" | relURL }}">Konferencje</a></nav><a class="github-link" href="https://github.com/patrykfajga" target="_blank" rel="noreferrer">GitHub ↗</a></div></header>
  <main class="single-wrap page-width"><p class="breadcrumb"><a href="{{ .Parent.RelPermalink }}">← {{ .Parent.Title }}</a></p><p class="eyebrow">{{ .Date.Format "02 / 01 / 2006" }}</p><h1>{{ .Title }}</h1><div class="single-meta">{{ with .Params.tags }}<span>{{ delimit . " · " }}</span>{{ end }}<span>Patryk Fajga</span></div><div class="single-content">{{ .Content }}</div><a class="single-back" href="{{ .Parent.RelPermalink }}">← Wróć do listy</a></main>
  <footer class="site-footer page-width"><span>© 2026 Patryk Fajga</span><a href="{{ "/" | relURL }}">Strona główna</a></footer>
</body>
</html>
